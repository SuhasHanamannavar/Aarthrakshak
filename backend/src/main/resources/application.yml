spring:
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: jdbc:h2:mem:aartharakshak
    username: sa
    password:
    driver-class-name: org.h2.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 5
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true

server:
  port: ${SERVER_PORT:8080}

supabase:
  url: ${SUPABASE_URL}
  anon-key: ${SUPABASE_ANON_KEY}
  jwt-secret: ${SUPABASE_JWT_SECRET}

ml:
  service:
    url: ${ML_SERVICE_URL:http://localhost:5000}
    fraud-threshold: ${ML_FRAUD_THRESHOLD:70}
    timeout-ms: ${ML_TIMEOUT_MS:5000}

geolocation:
  allowed-countries: IN,US,GB,CA,AU,SG,AE,DE,FR,JP
  suspicious-isps: vpn,proxy,tor,hosting,datacenter
